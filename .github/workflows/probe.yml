name: בראשית – בדיקת מקורות מחיר
on:
  workflow_dispatch: {}
  push:
    paths: ["probe.py", ".github/workflows/probe.yml"]
permissions:
  contents: write
jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - run: python3 probe.py
      - run: |
          git config user.name "bereshit-bot"; git config user.email "bereshit-bot@users.noreply.github.com"
          git add probe.json; git commit -m "probe $(date -u +%H:%MZ)" || exit 0
          for i in 1 2 3; do git pull --rebase && git push && break; sleep 5; done
