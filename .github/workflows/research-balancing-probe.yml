name: בראשית – בדיקת נתוני שירותי איזון ברומניה (מחקר)
# Manual only. Checks which Romanian balancing datasets ENTSO-E serves. Does not touch the live screen.
on:
  workflow_dispatch: {}
permissions:
  contents: write
concurrency:
  group: bereshit-update
  cancel-in-progress: false
jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python research/probe_balancing.py
        env:
          ENTSOE_TOKEN: ${{ secrets.ENTSOE_TOKEN }}
      - name: commit
        run: |
          git config user.name "bereshit-bot"
          git config user.email "bereshit-bot@users.noreply.github.com"
          git add research/data/balancing_probe.json
          git commit -m "research: balancing probe $(date -u +%Y-%m-%dT%H:%MZ)" || exit 0
          for i in 1 2 3; do git pull --rebase && git push && break; sleep 5; done
