name: בראשית – דיבאג מנוע (ידני)
on:
  workflow_dispatch: {}
permissions:
  contents: write
concurrency:
  group: bereshit-update
  cancel-in-progress: false
jobs:
  debug:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install numpy scipy
      - name: run engine update with log
        env:
          ENTSOE_TOKEN: ${{ secrets.ENTSOE_TOKEN }}
        run: |
          python engine.py update > engine_debug.txt 2>&1 || echo "EXIT $?" >> engine_debug.txt
          python - >> engine_debug.txt 2>&1 <<'PY'
          import urllib.request, http.cookiejar
          cj = http.cookiejar.CookieJar(); op = urllib.request.build_opener(urllib.request.HTTPCookieProcessor(cj))
          op.addheaders = [("User-Agent", "Mozilla/5.0 (bereshit)")]
          op.open("https://www.opcom.ro/grafice-ip-raportPIP-si-volumTranzactionat/ro", timeout=60).read()
          for d in ("26/10/2026", "27/10/2026"):
              try:
                  b = op.open(f"https://www.opcom.ro/rapoarte-pzu-raportPIP-export-csv/{d}/ro?resolution=15", timeout=60).read().decode("utf8", "replace")
                  lines = b.splitlines(); print("OPCOM CSV", d, len(lines), "lines"); print("\n".join(lines[:14])); print("...", lines[-3:])
              except Exception as e: print("OPCOM CSV", d, "error", repr(e)[:200])
          PY
          sed -i "s/${ENTSOE_TOKEN:-NO_TOKEN_SET}/[redacted]/g" engine_debug.txt
      - name: commit
        run: |
          git config user.name "bereshit-bot"
          git config user.email "bereshit-bot@users.noreply.github.com"
          git add engine_debug.txt data*.json
          git commit -m "engine debug $(date -u +%H:%MZ)" || exit 0
          for i in 1 2 3; do git pull --rebase -X theirs && git push && break; sleep 5; done
