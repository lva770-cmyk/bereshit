name: בראשית – דיבאג מנוע (ידני)
on:
  workflow_dispatch: {}
permissions:
  contents: write
concurrency:
  group: bereshit-update
  cancel-in-progress: false
jobs:
  debug:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install numpy scipy
      - name: run engine update with log
        env:
          ENTSOE_TOKEN: ${{ secrets.ENTSOE_TOKEN }}
        run: |
          python engine.py update > engine_debug.txt 2>&1 || echo "EXIT $?" >> engine_debug.txt
          python - >> engine_debug.txt 2>&1 <<'PY'
          import engine, datetime as dt, collections, json, urllib.request
          from zoneinfo import ZoneInfo
          for z in ("HU", "RO"):
              engine.use_zone(z)
              m = engine._src_energy_charts("2026-10-26", "2026-10-28")
              by = collections.Counter(dt.datetime.fromtimestamp(t, ZoneInfo("Europe/Budapest")).date().isoformat() for t in m)
              print(z, "energy-charts points per CET day:", dict(sorted(by.items())))
              ts = sorted(t for t in m if dt.datetime.fromtimestamp(t, ZoneInfo("Europe/Budapest")).date().isoformat() == "2026-10-27")
              if ts: print("  27.10 first/last", dt.datetime.fromtimestamp(ts[0], ZoneInfo("Europe/Budapest")), dt.datetime.fromtimestamp(ts[-1], ZoneInfo("Europe/Budapest")), "steps", sorted(set(b - a for a, b in zip(ts, ts[1:]))))
              try:
                  m2 = engine._src_entsoe("2026-10-26", "2026-10-28")
                  by2 = collections.Counter(dt.datetime.fromtimestamp(t, ZoneInfo("Europe/Budapest")).date().isoformat() for t in m2)
                  print(z, "ENTSO-E points per CET day:", dict(sorted(by2.items())))
              except Exception as e: print(z, "ENTSO-E error", repr(e)[:150])
          PY
          sed -i "s/${ENTSOE_TOKEN:-NO_TOKEN_SET}/[redacted]/g" engine_debug.txt
      - name: commit
        run: |
          git config user.name "bereshit-bot"
          git config user.email "bereshit-bot@users.noreply.github.com"
          git add engine_debug.txt data*.json
          git commit -m "engine debug $(date -u +%H:%MZ)" || exit 0
          for i in 1 2 3; do git pull --rebase -X theirs && git push && break; sleep 5; done
