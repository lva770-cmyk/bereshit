name: בראשית – מזג אוויר צפון-מזרח רומניה (מחקר)
# Manual only: fetches observed hourly weather into research/data/wx_ro_ne_obs.csv. Does not touch the live screen.
on:
  workflow_dispatch: {}
permissions:
  contents: write
concurrency:
  group: bereshit-update
  cancel-in-progress: false
jobs:
  fetch:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python research/fetch_ro_ne_weather.py
      - name: commit data
        run: |
          git config user.name "bereshit-bot"
          git config user.email "bereshit-bot@users.noreply.github.com"
          git add research/data/wx_ro_ne_obs.csv
          git commit -m "research: RO NE observed weather $(date -u +%Y-%m-%dT%H:%MZ)" || exit 0
          for i in 1 2 3; do git pull --rebase && git push && break; sleep 5; done
