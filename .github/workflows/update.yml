name: בראשית – עדכון נתונים
# Scheduled every 10 minutes, but GitHub skips most of these; each run therefore loops for ~2.8 h: fetch real HUPX day-ahead prices directly from the Energy-Charts API,
# ingest any missing day (two identical reads required), lock tomorrow's plan before 12:00 CET,
# and commit data.json. GitHub Pages then serves the updated screen. No AI, no personal computer.
on:
  schedule:
    - cron: "3,13,23,33,43,53 * * * *"   # GitHub drops many scheduled runs; more slots = more chances
  workflow_dispatch: {}
permissions:
  contents: write
concurrency:
  group: bereshit-update
  cancel-in-progress: false
jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 190
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install numpy scipy
      - name: year-long backtest for any zone that lacks one
        run: for z in HU RO RO2; do [ -f yearly-$z.json ] || python yearly.py $z || true; done
        env:
          ENTSOE_TOKEN: ${{ secrets.ENTSOE_TOKEN }}
      - name: update loop (every 5 min for ~2.8 h, commit on every change)
        # GitHub runs the schedule only every few hours in practice, so one run keeps watching instead of exiting:
        # new day-ahead prices, intraday auction results and balancing data reach the screen within ~5 minutes.
        env:
          ENTSOE_TOKEN: ${{ secrets.ENTSOE_TOKEN }}
        run: |
          git config user.name "bereshit-bot"
          git config user.email "bereshit-bot@users.noreply.github.com"
          for round in $(seq 1 34); do
            git pull -q --rebase -X theirs || true
            python engine.py update || echo "engine update failed (round $round)"
            python intraday_live.py || true
            python balancing.py || true
            if [ -n "$(git status --porcelain data*.json yearly-*.json bal-*.json)" ]; then
              git add data*.json yearly-*.json bal-*.json
              git commit -q -m "data: $(date -u +%Y-%m-%dT%H:%MZ)"
              for i in 1 2 3 4 5; do git pull -q --rebase -X theirs && git push -q && break; sleep 10; done
            fi
            if [ "$round" -lt 34 ]; then sleep 300; fi
          done
