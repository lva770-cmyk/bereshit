name: בראשית – עדכון נתונים
# Every 10 minutes (GitHub may skip some): fetch real HUPX day-ahead prices directly from the Energy-Charts API,
# ingest any missing day (two identical reads required), lock tomorrow's plan before 12:00 CET,
# and commit data.json. GitHub Pages then serves the updated screen. No AI, no personal computer.
on:
  schedule:
    - cron: "3,13,23,33,43,53 * * * *"   # GitHub drops many scheduled runs; more slots = more chances
  workflow_dispatch: {}
permissions:
  contents: write
concurrency:
  group: bereshit-update
  cancel-in-progress: false
jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install numpy scipy
      - run: python engine.py update
        env:
          ENTSOE_TOKEN: ${{ secrets.ENTSOE_TOKEN }}
      - name: year-long backtest for any zone that lacks one
        run: for z in HU RO RO2; do [ -f yearly-$z.json ] || python yearly.py $z || true; done
        env:
          ENTSOE_TOKEN: ${{ secrets.ENTSOE_TOKEN }}
      - name: balancing auctions + co-optimised plan (Project 50)
        run: python balancing.py || true
        env:
          ENTSOE_TOKEN: ${{ secrets.ENTSOE_TOKEN }}
      - name: commit if changed
        run: |
          if [ -n "$(git status --porcelain data*.json yearly-*.json bal-*.json)" ]; then
            git config user.name "bereshit-bot"
            git config user.email "bereshit-bot@users.noreply.github.com"
            git add data*.json yearly-*.json bal-*.json
            git commit -m "data: $(date -u +%Y-%m-%dT%H:%MZ)"
            for i in 1 2 3 4 5; do git pull --rebase -X theirs && git push && break; sleep 10; done
          fi
