name: בראשית – עדכון נתונים
# Every 30 minutes: fetch real HUPX day-ahead prices directly from the Energy-Charts API,
# ingest any missing day (two identical reads required), lock tomorrow's plan before 12:00 CET,
# and commit data.json. GitHub Pages then serves the updated screen. No AI, no personal computer.
on:
  schedule:
    - cron: "7,37 * * * *"
  workflow_dispatch: {}
permissions:
  contents: write
concurrency:
  group: bereshit-update
  cancel-in-progress: false
jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install numpy scipy
      - run: python engine.py update
      - name: year-long backtest for any zone that lacks one
        run: for z in HU RO DE; do [ -f yearly-$z.json ] || python yearly.py $z || true; done
      - name: commit if changed
        run: |
          if [ -n "$(git status --porcelain data*.json yearly-*.json)" ]; then
            git config user.name "bereshit-bot"
            git config user.email "bereshit-bot@users.noreply.github.com"
            git add data*.json yearly-*.json
            git commit -m "data: $(date -u +%Y-%m-%dT%H:%MZ)"
            git push
          fi
