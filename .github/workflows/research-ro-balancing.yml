name: בראשית – תוצאות מכרזי איזון רומניה (מחקר)
# Fetches a year of Romanian balancing-capacity auction results (aFRR / mFRR / FCR) from ENTSO-E.
on:
  workflow_dispatch: {}
permissions:
  contents: write
concurrency:
  group: bereshit-update
  cancel-in-progress: false
jobs:
  fetch:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python research/fetch_ro_balancing.py
        env:
          ENTSOE_TOKEN: ${{ secrets.ENTSOE_TOKEN }}
      - name: commit
        run: |
          git config user.name "bereshit-bot"
          git config user.email "bereshit-bot@users.noreply.github.com"
          git add research/data/ro_balancing.csv research/data/ro_balancing_status.json
          git commit -m "research: RO balancing auctions $(date -u +%Y-%m-%dT%H:%MZ)" || exit 0
          for i in 1 2 3; do git pull --rebase && git push && break; sleep 5; done
