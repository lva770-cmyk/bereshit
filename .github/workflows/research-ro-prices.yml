name: בראשית – מחירי רומניה לשנה (מחקר)
# Manual only: fetches a year of OPCOM day-ahead prices into research/data/ro_prices.csv. Does not touch the live screen.
on:
  workflow_dispatch: {}
permissions:
  contents: write
concurrency:
  group: bereshit-update
  cancel-in-progress: false
jobs:
  fetch:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install numpy scipy
      - run: python research/fetch_ro_prices.py
        env:
          ENTSOE_TOKEN: ${{ secrets.ENTSOE_TOKEN }}
      - name: commit data
        run: |
          git config user.name "bereshit-bot"
          git config user.email "bereshit-bot@users.noreply.github.com"
          git add research/data/ro_prices.csv
          git commit -m "research: RO prices $(date -u +%Y-%m-%dT%H:%MZ)" || exit 0
          for i in 1 2 3; do git pull --rebase && git push && break; sleep 5; done
